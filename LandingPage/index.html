<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>VELKRO</title>
</head>
<body>
    <script src="script.js" defer></script>

    <header>
        <img src="assets/VELKRO_logo_principal.svg" alt="VELKRO" class="logo"> 
        
        <button class="menu help-nav">
            HELP    
        </button>

        <button class="menu about-nav">
            ABOUT
        </button>

        <button class="menu shop-nav">
            SHOP
        </button>   

        <button class="menu home-nav" order="1">
            HOME
        </button>   

    </header>


    <main>
        <div class="bg-image">
            <div class="main-titles">

                <h2 class="titles title-1">MADE BY CR</h2>

                <h3 class="titles title-2">Nuestra visión del streetwear al mundo.</h3>
            </div>
        </div>
        <div class="button-container">
            <button class="button" id="shop-button">
                SHOP
            </button>

            <button class="button" id="info-button">
                INFO
            </button>
        </div>
    </main>

    <footer>
        JMTix - 2026
    </footer>
</body>
</html>
